name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # No install step: the pipeline runs on the standard library.
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run the demo
        run: python -m kyc_pipeline.demo --limit 5
      - name: Score routing against reviewer labels
        # Fails the build if a case a reviewer would stop was cleared automatically.
        run: python -m kyc_pipeline.evaluation

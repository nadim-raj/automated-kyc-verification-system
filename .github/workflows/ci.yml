name: CI

on:
  push:
    branches: [main]
  pull_request:

# The tests read the repo and nothing else; say so rather than inheriting.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # No install step: the pipeline runs on the standard library.
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run the demo
        run: python -m kyc_pipeline.demo --limit 5
      - name: Score routing against reviewer labels
        # Fails the build if a case a reviewer would stop was cleared automatically.
        run: python -m kyc_pipeline.evaluation
